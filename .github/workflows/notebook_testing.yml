name: Tutorial Notebook Testing

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  marimo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Only run workflow if certain files have been changed.
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            .github/workflows/notebook_testing.yml
            docs/tutorial/**
            src/**
            tests/**
            pyproject.toml

      - name: Setup packages
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: ./.github/actions/setup

      - name: Check notebooks
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          marimo check docs/tutorial/*.py docs/tutorial/advanced/*.py

      # marimo notebooks are Python scripts; running them executes all cells
      # and exits with a non-zero status if any cell raises an error.
      - name: Run tutorial notebooks
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          MPLBACKEND: Agg
        run: |
          failed=()
          for notebook in docs/tutorial/*.py docs/tutorial/advanced/*.py; do
            echo "::group::${notebook}"
            python "${notebook}" || failed+=("${notebook}")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::Notebook failed: %s\n' "${failed[@]}"
            exit 1
          fi
