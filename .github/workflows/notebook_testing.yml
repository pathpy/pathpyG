name: Tutorial Notebook Testing

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Only run workflow if certain files have been changed.
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            .github/workflows/notebook_testing.yml
            docs/tutorial/**
            src/**
            tests/**
            pyproject.toml

      - name: Setup packages
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: ./.github/actions/setup

      - name: Run tests
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          marimo check docs/tutorial/getting_started/*.py docs/tutorial/graph_learning/*.py docs/tutorial/advanced/*.py

      # The documentation renders the committed `.ipynb` exports of the notebooks without executing them,
      # so they have to be re-exported whenever a notebook changes.
      - name: Check exported notebooks are in sync
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          python docs/export_tutorials.py --check

      # marimo notebooks are Python scripts; running them executes all cells
      # and exits with a non-zero status if any cell raises an error.
      # Notebooks that take more than about a minute to run are skipped.
      - name: Run tutorial notebooks
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          MPLBACKEND: Agg
        run: |
          skip=(
            docs/tutorial/getting_started/manim_tutorial.py
            docs/tutorial/graph_learning/gcns.py
          )
          failed=()
          for notebook in docs/tutorial/getting_started/*.py docs/tutorial/graph_learning/*.py docs/tutorial/advanced/*.py; do
            if [[ " ${skip[*]} " == *" ${notebook} "* ]]; then
              echo "Skipping ${notebook}"
              continue
            fi
            echo "::group::${notebook}"
            python "${notebook}" || failed+=("${notebook}")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::Notebook failed: %s\n' "${failed[@]}"
            exit 1
          fi
